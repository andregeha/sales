description: 'AMF-regulated asset-management arm of Turgot Capital, an independent French financial group
  founded in 2003 that vertically integrates three businesses: financial and real-estate asset management
  (Turgot Asset Management), life-insurance solution design/brokerage (Turgot Life), and investment/asset-allocation
  advisory (Turgot Wealth). Turgot Capital joined Groupe Magellim in February 2022. Recent leadership
  change: Guillaume Hilaire became President on 2025-02-24, succeeding Francois Grandvoinnet; Sonia Raimbault
  is Directeur General.'
