description: 'Boutique Lebanese financial institution founded 2004, originally fixed-income institutional
  brokerage, upgraded in 2012 to a full financial institution (USD 5m paid-up capital) regulated by BDL.
  Four business lines: institutional fixed-income brokerage, asset management, corporate finance advisory
  and wealth management, serving financial institutions, corporates, family offices and private clients.
  Acquired 100% by LIBANK S.A.L. (Levant Investment Bank) in 2020 - now a subsidiary, not an independent
  buying centre. Publicly reported (The National, Sept 2024; Nowlebanon) as having been the subject of
  a 2015-2018 embezzlement/fraud investigation allegedly connected to former BDL governor Riad Salameh;
  this is public reporting on a legal/governance matter, not an OFS assessment of the firm''s current
  conduct or solvency.'
