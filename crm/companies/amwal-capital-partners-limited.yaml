description: Independent, investment-team-owned MENA asset manager established 2014 (with roots in Amwal
  AlKhaleej), DIFC-regulated by the DFSA and, via a Riyadh subsidiary (Amwal Capital Almaliyah, set up
  2023), CMA-regulated in Saudi Arabia. Manages capital for global sovereign wealth funds, funds of funds,
  multi-family offices, pensions, endowments, insurers and foundations, with a long-biased MENA public-equities
  strategy plus alternative-investment lines. In May 2024 the firm went live on Broadridge's investment
  management platform (portfolio, order and risk management, analytics and performance attribution) —
  a recently deployed incumbent system.
