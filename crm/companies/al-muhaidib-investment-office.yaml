description: Single-family investment office of Al Muhaidib Group, a diversified Dammam-based conglomerate
  (est. 1943) spanning food/consumer goods, industrial and infrastructure, real estate and financial investments
  across four continents. Has a dedicated Chief Investment Officer (Junaid Jafar, ~30 years in investment
  banking/management, ex-J.P. Morgan, Henderson Global Investors, Tadhamon Capital) responsible for both
  the Family Office and the Financial Investments vertical, covering international private markets and
  local/international public markets - a sign of a professionalising single-family office with its own
  investment function, not a compliance-driven third-party manager.
