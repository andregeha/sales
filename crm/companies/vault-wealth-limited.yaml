description: ADGM-regulated (FSRA Category 3C for managing assets, also Category 4 for advising/arranging)
  digital wealth platform, secured its licence mid-2023. Client assets are held at Interactive Brokers
  (IBKR), segregated, with SIPC/FDIC protection cited; delivery is via an app/digital platform to individual
  investors, with CFA/CFP-certified advisors described as fiduciaries. The business model (app-based,
  third-party custody, consumer-facing marketing comparing itself to a UAE retail bank's wealth offering)
  reads as a direct-to-consumer digital wealth/robo-advisory product rather than an institutional or family-office
  book-of-business needing a front-to-back PMS.
