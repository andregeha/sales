description: 'Wholly owned Saudi subsidiary of Bahrain-based The Family Office Company B.S.C. (c), a wealth
  manager serving GCC individuals and families since 2004, managing over USD 2.3bn in tailored portfolio
  solutions group-wide (min. ticket USD 300,000), incl. Shariah-compliant options, sourced from leading
  global asset managers. The Saudi entity is a closed joint-stock company (paid-up capital SR 20m) first
  licensed by the CMA for Arranging and Advisory in 2017, then upgraded to a full Managing Investments
  and Operating Funds licence in 2021, giving Saudi clients access to the group''s full investment-management
  service range. Riyadh office: Signature Center, Hittin district.'
