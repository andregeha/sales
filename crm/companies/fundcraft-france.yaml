description: French branch of Luxembourg-headquartered fundcraft, a digital AIFM / fund-operations platform
  providing management-company-as-a-service to third-party fund promoters and GPs. Opened a Paris office
  in January 2026 with Thomas Ibanez (ex-AMF) as Country Head France, then obtained AMF authorisation
  as an AIFM portfolio management company on 2026-06-24, allowing it to manage alternative investment
  funds in France. As a ManCo running many underlying client funds on one operational backbone, it is
  itself a direct buyer for multi-fund, multi-client NAV, subscriptions/redemptions, shareholder registry
  and fee administration - precisely Gaia's fund-administration module.
