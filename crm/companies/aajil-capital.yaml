description: Newly formed Saudi joint stock company, sister firm to Aajil (aajil.sa), an AI-driven B2B
  'buy now, pay later' platform supplying industrial SMEs with raw materials on deferred terms (SAR 600m
  supplied as of 2026-08-31). Aajil Capital received a CMA licence (Board resolution dated 2026-06-22,
  licence no. 26358-02) to conduct the Managing Investments activity, and has not yet commenced regulated
  operations pending completion of commencement-of-business requirements. Once live, plans to offer Shariah-compliant
  investment management giving investors exposure to Saudi industrial SMEs, building on sister-company
  origination data. Chaired by Abdulla Sheikh; CEO/CIO is Faisal Chowdhry, a former Goldman Sachs executive.
