  family offices as a client segment) and asset management (European/international equity, flexible international,
  value-oriented bond strategies). Underwent a leadership transition: Marie Vandermarcq-Saltiel became
  President in January 2024 and Gilles Constantini was named deputy general director for asset management,
  as long-standing President Arnaud de Langautier and General Director Olivier Lazar (in role since 2010/2012)
  stepped back.'
