description: 'New ADGM entity of Bank of Palestine (Palestine''s largest bank), which received an FSRA
  in-principle approval (IPA) on 29-Dec-2025 for a Category 1 (full banking) licence — the highest FSRA
  banking category, requiring USD 10m capital. Authorised activities on the IPA: accepting deposits and
  arranging deals in investments, targeting the global Palestinian diaspora with digital-first banking.
  Expected fully operational H2 2026. Bank of Palestine has held a DIFC representative office in Dubai
  since 2015 and recently opened a Cairo rep office; this ADGM entity is a genuine new, separately licensed
  operating bank, not a rep office. Linda Tarazi appointed CEO of the ADGM entity.'
